name: eval-retrieval

on:
  workflow_dispatch:
    inputs:
      reembed:
        description: 'Rebuild data/school-embeddings.json from schools.json before the eval'
        type: boolean
        default: false
      ask_model:
        description: 'Model for the ask eval (blank = production default)'
        type: string
        default: ''
  pull_request:
    paths:
      - 'lib/rag.ts'
      - 'lib/ask.ts'
      - 'lib/query-filters.ts'
      - 'scripts/embed-schools.ts'
      - 'data/school-embeddings.json'
      - 'evals/retrieval-*'
      - 'evals/run-retrieval-eval.ts'

jobs:
  eval-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Detect chunk builder change
        id: changed
        if: github.event_name == 'pull_request'
        run: |
          git diff --quiet origin/${{ github.base_ref }}...HEAD -- scripts/embed-schools.ts || echo "embed=true" >> "$GITHUB_OUTPUT"
          git diff --quiet origin/${{ github.base_ref }}...HEAD -- lib/ask.ts || echo "ask=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild embeddings (CI only, not committed)
        if: github.event.inputs.reembed == 'true' || steps.changed.outputs.embed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.EVAL_OPENAI_API_KEY }}
        run: npx ts-node --compiler-options '{"module":"commonjs","moduleResolution":"node"}' --transpile-only scripts/embed-schools.ts
      - name: Run retrieval eval
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.EVAL_OPENAI_API_KEY }}
          REEMBED: ${{ github.event.inputs.reembed == 'true' || steps.changed.outputs.embed == 'true' }}
        run: |
          if [ "$REEMBED" = "true" ]; then
            echo "Embeddings: rebuilt in CI" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Embeddings: committed file" >> "$GITHUB_STEP_SUMMARY"
          fi
          npm run eval:retrieval | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run ask eval (Claude's picks)
        if: github.event_name == 'workflow_dispatch' || steps.changed.outputs.ask == 'true'
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.EVAL_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.EVAL_ANTHROPIC_API_KEY }}
          ASK_MODEL: ${{ github.event.inputs.ask_model }}
        run: |
          echo "Ask model: ${ASK_MODEL:-default}" >> "$GITHUB_STEP_SUMMARY"
          npm run eval:retrieval:ask | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload retrieval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-results
          path: |
            evals/results/retrieval-*.json
            evals/results/ask-*.json
          if-no-files-found: ignore
