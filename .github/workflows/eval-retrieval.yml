name: eval-retrieval

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/rag.ts'
      - 'lib/ask.ts'
      - 'lib/query-filters.ts'
      - 'scripts/embed-schools.ts'
      - 'data/school-embeddings.json'
      - 'evals/retrieval-*'
      - 'evals/run-retrieval-eval.ts'

jobs:
  eval-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - name: Set up Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run retrieval eval
        env:
          OPENAI_API_KEY: ${{ secrets.EVAL_OPENAI_API_KEY }}
        run: npm run eval:retrieval | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload retrieval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-results
          path: evals/results/retrieval-*.json
          if-no-files-found: ignore
