# Production smoke tests — issue #125.
#
# Deliberately NOT part of the required `test` check on pull requests: it makes
# real network calls, so wiring it into PR gating would make CI flaky and block
# unrelated work. It runs against the deployed site instead.
name: smoke

on:
  push:
    branches: [main]
  schedule:
    # A few times a day, so a deploy that quietly breaks production is caught
    # without anyone looking at the site.
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # Vercel deploys from main independently of Actions, so on a push we wait
      # for the new deployment to go live before testing it. Without this we'd
      # smoke-test the previous build and learn nothing.
      - name: Wait for the deploy to land
        if: github.event_name == 'push'
        run: sleep 150

      - name: Smoke test production
        run: npm run smoke

      # Issue #286: one Playwright pass through the signed-out parent flow —
      # the ask box is excluded (paid model, rate-limited; #284/#285 cover
      # it). Not part of the required PR `test` check for the same reason
      # the rest of this workflow isn't: it hits the live site, so wiring it
      # into PR gating would make CI flaky and block unrelated work.
      - name: Cache Playwright browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser test the signed-out parent flow
        run: npm run e2e

      - name: Upload Playwright trace and screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
